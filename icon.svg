<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="70%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061" />
      <stop offset="50%" stop-color="#e5c158" />
      <stop offset="100%" stop-color="#b88f28" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0a0a0c" />
  <!-- Outer Ring (Gold Accent) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Camera Body Highlight -->
  <path d="M176 156 L208 112 H304 L336 156 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
  <!-- Inner Lens Barrel -->
  <circle cx="256" cy="256" r="140" fill="url(#lensGrad)" stroke="#1a1a24" stroke-width="4" />
  <!-- Lens Glass & Reflection -->
  <circle cx="256" cy="256" r="110" fill="url(#glassReflection)" />
  <!-- Lens Elements (Gold Ring Inside) -->
  <circle cx="256" cy="256" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />
  <circle cx="256" cy="256" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
  <!-- Aperture Blades (Sleek Pro indicator) -->
  <path d="M256 186 L280 230" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <path d="M286 256 L242 280" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <path d="M256 326 L232 282" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <path d="M226 256 L270 232" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <!-- Camera Sensor Reflex/Flash Point -->
  <circle cx="220" cy="220" r="12" fill="#fff" opacity="0.4" filter="blur(1px)" />
  <circle cx="280" cy="280" r="6" fill="#f5d061" opacity="0.7" />
</svg>
